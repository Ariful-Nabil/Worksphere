<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --bg: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--glass-bg);
            width: 100%;
            max-width: 420px;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 1.85rem;
            color: #111827;
            font-weight: 700;
        }

        .header p {
            color: #6b7280;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .alert-error {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            border: 1px solid #fee2e2;
            text-align: center;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: var(--primary-hover);
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header">
            <h1>Welcome Back</h1>
            <p>Access your dashboard</p>
        </div>

        <div id="errorAlert" class="alert-error">Email or password is incorrect</div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="name@company.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script>
        // Mock Database for testing
        const mockDB = [
            { email: 'hr@nexus.com', password: 'password123', role: 'HR' },
            { email: 'client@nexus.com', password: 'password123', role: 'Client' },
            { email: 'emp@nexus.com', password: 'password123', role: 'Employee' }
        ];

        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';

            const emailInput = document.getElementById('email').value.trim();
            const passwordInput = document.getElementById('password').value;

            // 1. Check if fields are empty (HTML 'required' covers this, but JS for safety)
            if (!emailInput || !passwordInput) {
                showError();
                return;
            }

            // 2. Validate against Mock DB
            const user = mockDB.find(u => u.email === emailInput && u.password === passwordInput);

            if (user) {
                // Successful Login - Redirect based on role
                console.log(`Success! Redirecting to ${user.role} dashboard...`);
                
                if (user.role === 'HR') {
                    window.location.href = '/dashboard/hr';
                } else if (user.role === 'Client') {
                    window.location.href = '/dashboard/client';
                } else {
                    window.location.href = '/dashboard/employee';
                }
            } else {
                // 3. Show failure message
                showError();
            }
        });

        function showError() {
            errorAlert.style.display = 'block';
            // Simple shake animation effect
            const card = document.querySelector('.login-card');
            card.style.transform = 'translateX(5px)';
            setTimeout(() => card.style.transform = 'translateX(-5px)', 50);
            setTimeout(() => card.style.transform = 'translateX(0)', 100);
        }
    </script>
</body>
</html>
