<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Dashboard | Nexus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --sidebar: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
            --border: #e2e8f0;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        nav {
            width: 260px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.2s;
        }

        .nav-item.active {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-weight: 600;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 1.75rem; }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--white);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .stat-card i {
            padding: 10px;
            background: #f1f5f9;
            border-radius: 12px;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .stat-card h3 {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 5px;
        }

        /* Tables Layout */
        .table-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .table-container {
            background: var(--white);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .table-container h2 {
            font-size: 1.1rem;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            background: #e0e7ff;
            color: var(--primary);
        }

        @media (max-width: 1024px) {
            .table-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">
            <i data-lucide="layout-dashboard"></i>
            Nexus HR
        </div>
        <a href="#" class="nav-item active"><i data-lucide="home"></i> Dashboard</a>
        <a href="#" class="nav-item"><i data-lucide="users"></i> Employees</a>
        <a href="#" class="nav-item"><i data-lucide="user-check"></i> Clients</a>
        <a href="#" class="nav-item"><i data-lucide="file-text"></i> Payroll</a>
        <a href="#" class="nav-item"><i data-lucide="megaphone"></i> Notices</a>
        <div style="margin-top: auto;">
            <a href="login.html" class="nav-item" style="color: #ef4444;"><i data-lucide="log-out"></i> Logout</a>
        </div>
    </nav>

    <main>
        <div class="header">
            <div>
                <h1>Office Operations</h1>
                <p style="color: var(--text-muted);">Overview for May 2026</p>
            </div>
            <button style="padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">
                + Add Employee
            </button>
        </div>

        <!-- Summary Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <i data-lucide="users"></i>
                <h3>Total Employees</h3>
                <div class="value" id="totalEmployees">1,248</div>
            </div>
            <div class="stat-card">
                <i data-lucide="user-check"></i>
                <h3>Active Clients</h3>
                <div class="value" id="activeClients">84</div>
            </div>
            <div class="stat-card">
                <i data-lucide="shopping-cart"></i>
                <h3>Pending Orders</h3>
                <div class="value" id="pendingOrders">12</div>
            </div>
            <div class="stat-card">
                <i data-lucide="credit-card"></i>
                <h3>Payroll Due (May)</h3>
                <div class="value" id="payrollDue">$42,500</div>
            </div>
        </div>

        <!-- Tables Section -->
        <div class="table-grid">
            <!-- Recent Notices -->
            <div class="table-container">
                <h2>Recent Notices <a href="#" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">View All</a></h2>
                <table>
                    <thead>
                        <tr>
                            <th>Notice Title</th>
                            <th>Date Published</th>
                        </tr>
                    </thead>
                    <tbody id="noticesTable">
                        <!-- Loaded via Script -->
                    </tbody>
                </table>
            </div>

            <!-- Recent Additions -->
            <div class="table-container">
                <h2>Recent Employee Additions</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="employeesTable">
                        <!-- Loaded via Script -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        // Data Mocking (Simulating DB Fetch)
        const recentNotices = [
            { title: "Annual General Meeting 2026", date: "May 01, 2026" },
            { title: "New Health Insurance Policy", date: "Apr 28, 2026" },
            { title: "System Maintenance Schedule", date: "Apr 25, 2026" },
            { title: "Quarterly Performance Bonus", date: "Apr 20, 2026" },
            { title: "Office Renovation Notice", date: "Apr 15, 2026" }
        ];

        const recentEmployees = [
            { name: "Sarah Jenkins", role: "Software Engineer" },
            { name: "Michael Chen", role: "Product Designer" },
            { name: "Amara Okoro", role: "Marketing Lead" },
            { name: "James Wilson", role: "HR Specialist" },
            { name: "Sofia Rodriguez", role: "Account Manager" }
        ];

        // Populate Tables
        function renderTables() {
            const noticeBody = document.getElementById('noticesTable');
            noticeBody.innerHTML = recentNotices.map(n => `
                <tr>
                    <td>${n.title}</td>
                    <td style="color: var(--text-muted);">${n.date}</td>
                </tr>
            `).join('');

            const employeeBody = document.getElementById('employeesTable');
            employeeBody.innerHTML = recentEmployees.map(e => `
                <tr>
                    <td style="font-weight: 600;">${e.name}</td>
                    <td><span class="badge">${e.role}</span></td>
                </tr>
            `).join('');
        }

        // Initialize Dashboard
        window.onload = renderTables;
    </script>
</body>
</html>
