<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees | Nexus HR</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Reusing Sidebar Style */
        nav { width: 260px; background: var(--white); border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 10px; margin-bottom: 5px; }
        .nav-item.active { background: rgba(37, 99, 235, 0.1); color: var(--primary); font-weight: 600; }

        main { flex: 1; padding: 40px; }

        /* Toolbar */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; }
        .search-wrapper { position: relative; flex: 1; max-width: 400px; }
        .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; }
        .search-input { width: 100%; padding: 12px 12px 12px 40px; border: 1px solid var(--border); border-radius: 12px; outline: none; }

        .btn-add { background: var(--primary); color: white; padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* Table Style */
        .table-container { background: var(--white); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 16px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        .status-pill { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-active { background: #dcfce7; color: #166534; }
        .status-inactive { background: #fee2e2; color: #991b1b; }

        .actions { display: flex; gap: 10px; }
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .btn-icon:hover { color: var(--primary); }
        .btn-icon.delete:hover { color: var(--danger); }

        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; width: 500px; border-radius: 20px; padding: 30px; position: relative; }
        .modal-header { margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: span 2; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-item"><i data-lucide="layout-dashboard"></i> Dashboard</div>
        <a href="#" class="nav-item active"><i data-lucide="users"></i> Employees</a>
        <div class="nav-item"><i data-lucide="user-check"></i> Clients</div>
        <div class="nav-item"><i data-lucide="file-text"></i> Payroll</div>
    </nav>

    <main>
        <div class="toolbar">
            <div class="search-wrapper">
                <i data-lucide="search"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="Search by name or ID...">
            </div>
            <button class="btn-add" onclick="toggleModal(true)">
                <i data-lucide="plus"></i> Add Employee
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Rows injected via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Register New Employee</h2>
            </div>
            <form id="employeeForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Full Name</label>
                        <input type="text" id="empName" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="empEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="empPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select id="empDept" required>
                            <option value="Engineering">Engineering</option>
                            <option value="Marketing">Marketing</option>
                            <option value="HR">HR</option>
                            <option value="Sales">Sales</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Salary (Monthly)</label>
                        <input type="number" id="empSalary" required>
                    </div>
                    <div class="form-group full">
                        <label>Role</label>
                        <select id="empRole" required>
                            <option value="Employee">Staff Member</option>
                            <option value="HR">HR Manager</option>
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" class="btn-add" style="background: #e2e8f0; color: var(--text-main);" onclick="toggleModal(false)">Cancel</button>
                    <button type="submit" class="btn-add" style="flex: 1; justify-content: center;">Save Employee</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let employees = [
            { id: 'EMP-1001', name: 'Sarah Jenkins', email: 'sarah@nexus.com', dept: 'Engineering', salary: 5500, status: 'Active' },
            { id: 'EMP-1002', name: 'Michael Chen', email: 'michael@nexus.com', dept: 'Marketing', salary: 4800, status: 'Active' },
            { id: 'EMP-1003', name: 'Amara Okoro', email: 'amara@nexus.com', dept: 'HR', salary: 5200, status: 'Inactive' }
        ];

        function renderTable(data = employees) {
            const body = document.getElementById('employeeTableBody');
            body.innerHTML = data.map(emp => `
                <tr>
                    <td><span style="font-family: monospace; font-weight: 600;">${emp.id}</span></td>
                    <td style="font-weight: 600;">${emp.name}</td>
                    <td>${emp.email}</td>
                    <td>${emp.dept}</td>
                    <td>$${emp.salary.toLocaleString()}</td>
                    <td><span class="status-pill ${emp.status === 'Active' ? 'status-active' : 'status-inactive'}">${emp.status}</span></td>
                    <td class="actions">
                        <button class="btn-icon"><i data-lucide="edit-3"></i></button>
                        <button class="btn-icon delete" onclick="deactivateEmp('${emp.id}')"><i data-lucide="user-minus"></i></button>
                    </td>
                </tr>
            `).join('');
            lucide.createIcons();
        }

        // Search Implementation
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = employees.filter(emp => 
                emp.name.toLowerCase().includes(term) || emp.id.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        function toggleModal(show) {
            document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        }

        function deactivateEmp(id) {
            const emp = employees.find(e => e.id === id);
            if(emp) {
                emp.status = emp.status === 'Active' ? 'Inactive' : 'Active';
                renderTable();
            }
        }

        // Add Employee Logic
        document.getElementById('employeeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('empEmail').value;

            // Duplicate Email Check
            if (employees.some(emp => emp.email === email)) {
                alert('This email is already registered');
                return;
            }

            const newEmp = {
                id: `EMP-${1000 + employees.length + 1}`,
                name: document.getElementById('empName').value,
                email: email,
                dept: document.getElementById('empDept').value,
                salary: parseInt(document.getElementById('empSalary').value),
                status: 'Active'
            };

            employees.push(newEmp);
            renderTable();
            toggleModal(false);
            e.target.reset();
        });

        renderTable();
    </script>
</body>
</html>
