<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Registration | Secure Access</title>
    <!-- Google Fonts for a premium look -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --bg: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .signup-card {
            background: var(--glass-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.75rem;
            color: #111827;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .header p {
            color: #6b7280;
            margin-top: 8px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            margin-left: 4px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #fff;
            color: #1f2937;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .error-msg {
            color: var(--error);
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }

        .btn-register {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: var(--primary-hover);
        }

        .btn-register:active {
            transform: scale(0.98);
        }

        .login-link {
            text-align: center;
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Success State */
        #success-toast {
            display: none;
            background: var(--success);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            position: fixed;
            top: 20px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="success-toast">Account created successfully</div>

    <div class="signup-card">
        <div class="header">
            <h1>Join the Network</h1>
            <p>Enter your details to set up your profile</p>
        </div>

        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="e.g. Alex Rivera">
                <div class="error-msg" id="nameError">Full Name cannot be empty</div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="example@mail.com">
                <div class="error-msg" id="emailError">Invalid email format</div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="phone" placeholder="11-digit mobile number">
                <div class="error-msg" id="phoneError">Phone must be exactly 11 digits</div>
            </div>

            <div class="form-group">
                <label>Assign Role</label>
                <select id="role">
                    <option value="" selected disabled>Choose your role...</option>
                    <option value="HR">HR Professional</option>
                    <option value="Client">Client Representative</option>
                    <option value="Employee">Staff Member</option>
                </select>
                <div class="error-msg" id="roleError">Please select a role</div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Min. 8 characters">
                <div class="error-msg" id="passError">Password too short</div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Repeat your password">
                <div class="error-msg" id="confirmError">Passwords do not match</div>
            </div>

            <button type="submit" class="btn-register">Register Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="#">Login</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        
        // Mock DB Check (Example: email 'test@mail.com' is taken)
        const registeredEmails = ['test@mail.com', 'admin@hr.com'];

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset errors
            document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
            let isValid = true;

            // 1. Name Check
            if (document.getElementById('fullName').value.trim() === '') {
                showError('nameError');
                isValid = false;
            }

            // 2. Email Check
            const email = document.getElementById('email').value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('emailError', 'Email must be in valid format');
                isValid = false;
            } else if (registeredEmails.includes(email.toLowerCase())) {
                showError('emailError', 'Email already in use');
                isValid = false;
            }

            // 3. Phone Check
            const phone = document.getElementById('phone').value;
            if (phone.length !== 11 || isNaN(phone)) {
                showError('phoneError');
                isValid = false;
            }

            // 4. Role Check
            if (document.getElementById('role').value === "") {
                showError('roleError');
                isValid = false;
            }

            // 5. Password Check
            const pass = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (pass.length < 8) {
                showError('passError');
                isValid = false;
            } else if (pass !== confirm) {
                showError('confirmError');
                isValid = false;
            }

            // Final Action
            if (isValid) {
                const toast = document.getElementById('success-toast');
                toast.style.display = 'block';
                
                // Simulate redirection
                setTimeout(() => {
                    window.location.href = '#login-page'; // Replace with your actual login route
                }, 2000);
            }
        });

        function showError(id, customMsg) {
            const el = document.getElementById(id);
            if(customMsg) el.textContent = customMsg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
