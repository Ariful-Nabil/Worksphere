<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | Nexus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #6366f1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        nav { width: 260px; background: var(--white); border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; }
        .logo { font-weight: 700; font-size: 1.4rem; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 10px; margin-bottom: 5px; }
        .nav-item.active { background: rgba(99, 102, 241, 0.1); color: var(--accent); font-weight: 600; }

        main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { margin-bottom: 30px; }

        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px; margin-bottom: 40px; }
        .stat-card { background: var(--white); padding: 30px; border-radius: 24px; border: 1px solid var(--border); position: relative; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-card h3 { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
        .stat-card .value { font-size: 2.2rem; font-weight: 800; display: flex; align-items: center; gap: 15px; }
        
        .badge-count { background: #fee2e2; color: #ef4444; padding: 4px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; }
        .badge-pending { background: #e0e7ff; color: #4338ca; padding: 4px 12px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; }

        /* Table Section */
        .section-card { background: var(--white); border-radius: 24px; border: 1px solid var(--border); padding: 30px; }
        .section-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); padding: 15px 10px; border-bottom: 1px solid var(--border); }
        td { padding: 20px 10px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s; }
        tr:hover td { background: #fafafa; }

        .unread-row { font-weight: 700; color: var(--text-main); }
        .unread-indicator { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; display: inline-block; margin-right: 10px; }

        /* Notice Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); display: none; align-items: center; justify-content: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal { background: white; width: 500px; border-radius: 24px; padding: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal h2 { margin-bottom: 15px; font-size: 1.5rem; }
        .modal p { color: #475569; line-height: 1.6; margin-bottom: 25px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo"><i data-lucide="user-circle"></i> <span>EmployeeHub</span></div>
        <a href="#" class="nav-item active"><i data-lucide="layout"></i> <span>Dashboard</span></a>
        <a href="#" class="nav-item"><i data-lucide="file-edit"></i> <span>My Applications</span></a>
        <a href="#" class="nav-item"><i data-lucide="calendar"></i> <span>Time Off</span></a>
        <a href="#" class="nav-item"><i data-lucide="settings"></i> <span>Profile</span></a>
    </nav>

    <main>
        <div class="header">
            <h1>Hello, Sarah Jenkins</h1>
            <p style="color: var(--text-muted);">Here are the latest updates from HR.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Unread Notices</h3>
                <div class="value">
                    <span id="unreadCountDisplay">0</span>
                    <span class="badge-count">New Messages</span>
                </div>
            </div>
            <div class="stat-card">
                <h3>My Pending Applications</h3>
                <div class="value">
                    <span id="pendingAppsCount">2</span>
                    <span class="badge-pending">In Review</span>
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-header">
                <h2>Recent Notices</h2>
                <span style="font-size: 0.85rem; color: var(--text-muted);">Click to read</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="noticeTable">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="noticeModal">
        <div class="modal">
            <h2 id="modalTitle"></h2>
            <p id="modalContent"></p>
            <button onclick="closeNotice()" style="width: 100%; padding: 14px; background: var(--text-main); color: white; border: none; border-radius: 12px; font-weight: 600; cursor: pointer;">Mark as Read</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        let notices = [
            { id: 1, title: "Summer Holiday Schedule", date: "May 02, 2026", content: "The office will be closed on July 4th for the summer holiday. Enjoy your time off!", read: false },
            { id: 2, title: "New Health Benefit Package", date: "Apr 30, 2026", content: "We have updated our dental insurance provider to BlueShield. Check your email for details.", read: false },
            { id: 3, title: "Quarterly Town Hall Meeting", date: "Apr 28, 2026", content: "Join us via Zoom at 2:00 PM for the company-wide update.", read: true },
            { id: 4, title: "IT Security Warning", date: "Apr 25, 2026", content: "Please do not open attachments from unknown external senders.", read: true },
            { id: 5, title: "Parking Lot Maintenance", date: "Apr 22, 2026", content: "Section B will be closed for repaving starting Monday.", read: true }
        ];

        function updateUnreadCount() {
            const count = notices.filter(n => !n.read).length;
            document.getElementById('unreadCountDisplay').innerText = count;
        }

        function renderNotices() {
            const table = document.getElementById('noticeTable');
            table.innerHTML = notices.map(n => `
                <tr class="${n.read ? '' : 'unread-row'}" onclick="openNotice(${n.id})">
                    <td>
                        ${n.read ? '' : '<span class="unread-indicator"></span>'}
                        ${n.title}
                    </td>
                    <td style="color: var(--text-muted);">${n.date}</td>
                </tr>
            `).join('');
            updateUnreadCount();
        }

        let currentNoticeId = null;

        function openNotice(id) {
            const notice = notices.find(n => n.id === id);
            document.getElementById('modalTitle').innerText = notice.title;
            document.getElementById('modalContent').innerText = notice.content;
            document.getElementById('noticeModal').style.display = 'flex';
            currentNoticeId = id;
        }

        function closeNotice() {
            const notice = notices.find(n => n.id === currentNoticeId);
            if (notice) notice.read = true;
            document.getElementById('noticeModal').style.display = 'none';
            renderNotices();
        }

        window.onload = renderNotices;
    </script>
</body>
</html>
