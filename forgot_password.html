<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Nexus Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --error: #ef4444;
            --success: #10b981;
            --bg: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f3f4f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-card {
            background: var(--glass-bg);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 1.6rem;
            color: #111827;
            font-weight: 700;
        }

        .header p {
            color: #6b7280;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .input-with-btn {
            display: flex;
            gap: 10px;
        }

        .btn-send {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 0 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-send:hover { background: #e2e8f0; }

        .error-msg {
            color: var(--error);
            font-size: 0.75rem;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }

        .btn-reset {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-reset:hover { background: var(--primary-hover); }

        .back-link {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
        }

        .back-link a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            color: #6b7280;
        }

        .back-link a:hover { color: var(--primary); }

        /* Step visibility */
        #step2 { display: none; margin-top: 20px; border-top: 1px solid #e5e7eb; padding-top: 20px; }

        #success-msg {
            display: none;
            background: var(--success);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div id="success-msg">Password updated successfully!</div>

        <div class="header">
            <h1>Account Recovery</h1>
            <p>Verification code will be sent to your email</p>
        </div>

        <form id="resetForm">
            <!-- STEP 1: Email & Code -->
            <div class="form-group">
                <label>Registered Email</label>
                <div class="input-with-btn">
                    <input type="email" id="email" placeholder="name@company.com">
                    <button type="button" class="btn-send" id="sendCodeBtn">Send Code</button>
                </div>
                <div class="error-msg" id="emailError">Please enter a registered email</div>
            </div>

            <div class="form-group">
                <label>Verification Code</label>
                <input type="text" id="vCode" placeholder="Enter 6-digit code">
                <div class="error-msg" id="codeError">Invalid or incorrect code</div>
            </div>

            <!-- STEP 2: New Password (Hidden until code is "sent") -->
            <div id="step2">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPass" placeholder="Min. 8 characters">
                    <div class="error-msg" id="passError">Password too short</div>
                </div>

                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPass" placeholder="Repeat new password">
                    <div class="error-msg" id="confirmError">Passwords do not match</div>
                </div>

                <button type="submit" class="btn-reset">Update Password</button>
            </div>
        </form>

        <div class="back-link">
            <a href="login.html">← Back to Login</a>
        </div>
    </div>

    <script>
        const registeredEmails = ['hr@nexus.com', 'client@nexus.com', 'emp@nexus.com'];
        const correctCode = "123456"; // Mock verification code

        const sendBtn = document.getElementById('sendCodeBtn');
        const resetForm = document.getElementById('resetForm');
        const step2 = document.getElementById('step2');

        // Handling "Send Code"
        sendBtn.addEventListener('click', () => {
            const email = document.getElementById('email').value.trim();
            const emailError = document.getElementById('emailError');
            
            if (registeredEmails.includes(email.toLowerCase())) {
                emailError.style.display = 'none';
                alert("A code (123456) has been sent to " + email);
                step2.style.display = 'block';
                sendBtn.innerText = "Resend";
            } else {
                emailError.style.display = 'block';
            }
        });

        // Handling Final Reset
        resetForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Reset Error Displays
            document.querySelectorAll('.error-msg').forEach(m => m.style.display = 'none');

            const codeInput = document.getElementById('vCode').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            let isValid = true;

            // Validate Code
            if (codeInput !== correctCode) {
                document.getElementById('codeError').style.display = 'block';
                isValid = false;
            }

            // Validate Password Length
            if (newPass.length < 8) {
                document.getElementById('passError').style.display = 'block';
                isValid = false;
            }

            // Validate Match
            if (newPass !== confirmPass) {
                document.getElementById('confirmError').style.display = 'block';
                isValid = false;
            }

            if (isValid) {
                document.getElementById('success-msg').style.display = 'block';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
