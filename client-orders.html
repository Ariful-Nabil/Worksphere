<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Nexus Client Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --white: #ffffff;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar Sidebar */
        nav { width: 260px; background: var(--white); border-right: 1px solid var(--border); padding: 30px 20px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 10px; margin-bottom: 5px; }
        .nav-item.active { background: rgba(37, 99, 235, 0.1); color: var(--primary); font-weight: 600; }

        main { flex: 1; padding: 40px; max-width: 1100px; }

        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; }

        /* Filter Bar */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 25px; background: #fff; padding: 6px; border-radius: 14px; width: fit-content; border: 1px solid var(--border); }
        .filter-btn { padding: 8px 20px; border: none; background: none; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; }

        /* Table Container */
        .table-container { background: var(--white); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; text-align: left; padding: 16px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 18px 16px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }

        /* Status Styling */
        .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
        .dot-pending { background: #f59e0b; }
        .dot-inprogress { background: #3b82f6; }
        .dot-completed { background: #10b981; }

        .btn-view { padding: 6px 14px; border: 1px solid var(--border); border-radius: 8px; background: white; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-view:hover { border-color: var(--primary); color: var(--primary); }

        /* Detail Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: white; width: 450px; border-radius: 20px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
        .modal-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 20px; }
        .detail-row { margin-bottom: 15px; font-size: 0.95rem; }
        .detail-label { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 600; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-item"><i data-lucide="layout-grid"></i> Dashboard</div>
        <div class="nav-item active"><i data-lucide="package"></i> My Orders</div>
        <div class="nav-item"><i data-lucide="receipt"></i> Billing</div>
    </nav>

    <main>
        <div class="page-header">
            <h1>Track Orders</h1>
            <p style="color: var(--text-muted);">Manage and monitor your service requests in real-time.</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterTable('All', this)">All</button>
            <button class="filter-btn" onclick="filterTable('Pending', this)">Pending</button>
            <button class="filter-btn" onclick="filterTable('In Progress', this)">In Progress</button>
            <button class="filter-btn" onclick="filterTable('Completed', this)">Completed</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Service Type</th>
                        <th>Date Submitted</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="orderTableBody">
                    <!-- Data injected via script -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Details Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-title">Order Details</div>
            <div id="modalContent"></div>
            <button onclick="closeModal()" style="width: 100%; margin-top: 20px; padding: 12px; background: #f1f5f9; border: none; border-radius: 10px; font-weight: 600; cursor: pointer;">Close Details</button>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const orders = [
            { id: "ORD-771", service: "Strategic Consulting", date: "May 01, 2026", status: "In Progress", notes: "Consultant assigned. Initial meeting scheduled for Monday." },
            { id: "ORD-752", service: "IT Audit", date: "Apr 28, 2026", status: "Pending", notes: "Awaiting document upload from client side." },
            { id: "ORD-698", service: "Staffing Solution", date: "Apr 20, 2026", status: "Completed", notes: "Final candidates selected and onboarded." },
            { id: "ORD-640", service: "Cloud Migration", date: "Apr 15, 2026", status: "In Progress", notes: "Data transfer 60% complete." },
            { id: "ORD-612", service: "Risk Assessment", date: "Apr 10, 2026", status: "Completed", notes: "Final report delivered and signed." }
        ];

        function renderTable(filter = 'All') {
            const body = document.getElementById('orderTableBody');
            const data = filter === 'All' ? orders : orders.filter(o => o.status === filter);
            
            body.innerHTML = data.map(o => `
                <tr>
                    <td style="font-weight: 700;">${o.id}</td>
                    <td>${o.service}</td>
                    <td style="color: var(--text-muted);">${o.date}</td>
                    <td>
                        <span class="status-dot ${getDotClass(o.status)}"></span>
                        ${o.status}
                    </td>
                    <td><button class="btn-view" onclick="viewDetails('${o.id}')">View Details</button></td>
                </tr>
            `).join('');
        }

        function getDotClass(status) {
            if (status === 'Pending') return 'dot-pending';
            if (status === 'In Progress') return 'dot-inprogress';
            return 'dot-completed';
        }

        function filterTable(status, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable(status);
        }

        function viewDetails(id) {
            const order = orders.find(o => o.id === id);
            const content = document.getElementById('modalContent');
            content.innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Service</span>
                    <strong>${order.service}</strong>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Current Progress</span>
                    <strong>${order.status}</strong>
                </div>
                <div class="detail-row" style="background: #fdf2f2; padding: 12px; border-radius: 8px; border: 1px solid #fee2e2;">
                    <span class="detail-label" style="color: #991b1b;">HR Management Notes</span>
                    <p style="font-size: 0.9rem; line-height: 1.4;">${order.notes}</p>
                </div>
            `;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        window.onload = () => renderTable();
    </script>
</body>
</html>
